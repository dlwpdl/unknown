allprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin('com.android.application')) {
            p.android.signingConfigs.create('glingUpload') {
                storeFile new File(System.getenv('GLING_UPLOAD_KEYSTORE'))
                storePassword System.getenv('GLING_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('GLING_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('GLING_UPLOAD_KEY_PASSWORD')
            }
            def releaseBuild = p.android.buildTypes.release
            releaseBuild.signingConfig = p.android.signingConfigs.glingUpload
            releaseBuild.minifyEnabled = true
            releaseBuild.shrinkResources = true
            // AGP 9 rejects resolving the legacy profile; preserve project keep rules.
            def optimizedRules = p.android.getDefaultProguardFile('proguard-android-optimize.txt')
            def defaultRules = new File(optimizedRules.parentFile, optimizedRules.name.replace('proguard-android-optimize.txt', 'proguard-android.txt'))
            releaseBuild.setProguardFiles(releaseBuild.proguardFiles.collect { rules ->
                rules == defaultRules ? optimizedRules : rules
            })
            // Room builds WorkManager's database by reflection; full R8 dropped its constructor and 1.4.5 crashed at launch.
            def keepRules = new File(p.buildDir, 'gling-keep-rules.pro')
            keepRules.parentFile.mkdirs()
            keepRules.text = '-keep class * extends androidx.room.RoomDatabase { <init>(...); }\n'
            releaseBuild.proguardFile(keepRules)
        }
    }
}

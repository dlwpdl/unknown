<!doctype html>

<style>
:root{color-scheme:light;--ink:#252631;--muted:#656a7a;--accent:#6550a6;--line:#e2e4ec;--paper:#f6f7fa;--selected:#ede9f7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}button,input{font:inherit}button,summary,a{min-height:44px}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:inherit;padding:10px 15px}button:active,summary:active{background:var(--selected)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:208px;background:white;border-right:1px solid var(--line);padding:24px 16px}aside strong{font-size:26px;letter-spacing:-1.5px;display:block;padding:0 12px 40px}nav{display:grid;gap:8px}nav button{text-align:left;border:0;color:var(--muted);font-weight:600}nav button[aria-current=page]{color:var(--accent);background:var(--selected)}main{margin-left:208px}.bar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:white;border-bottom:1px solid var(--line)}.demo{font-size:12px;color:var(--accent);background:var(--selected);padding:4px 10px;border-radius:5px}.page{max-width:1120px;margin:0 auto;padding:28px 32px 72px}.back{background:none;border:0;color:var(--muted);padding-left:0}.heading{margin:20px 0 24px}h1{font-size:26px;line-height:1.4;letter-spacing:-.7px;margin:10px 0 8px}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0}p{margin:8px 0}.muted{color:var(--muted)}.badge{font-size:12px;border-radius:5px;background:#ebf5ef;color:#257454;padding:4px 8px}.tabs{display:flex;gap:20px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{border:0;border-radius:0;background:none;color:var(--muted);white-space:nowrap;padding:10px 2px}.tabs button[aria-selected=true]{border-bottom:2px solid var(--accent);color:var(--accent);font-weight:650}.card{padding:22px 24px;background:white;border:1px solid var(--line);border-radius:12px}.facts{display:flex;gap:16px 32px;flex-wrap:wrap;margin:0 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line)}.facts>div{display:grid;gap:4px}.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:0;font-weight:600}.link{border:0;background:none;color:var(--accent);padding:0;text-align:left}details{border-top:1px solid var(--line);margin-top:22px}summary{cursor:pointer;display:flex;align-items:center;gap:10px;list-style:none;color:var(--muted)}summary::before{content:'+';font-size:18px}details[open]>summary::before{content:'−'}details>div{padding:8px 0 16px}details dl{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:0}details dt{color:var(--muted)}details dd{margin:0;overflow-wrap:anywhere}.copy{max-width:72ch;white-space:pre-wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:24px}.stats>div{padding:16px 20px;background:white}.stats span{display:block;font-size:12px;color:var(--muted)}.stats strong{display:block;font-size:24px;margin-top:3px}.section-summary{justify-content:space-between;color:var(--ink);font-weight:600;min-height:64px}.section-summary::before{display:none}.section-summary small{font-weight:400;color:var(--muted)}.notes{font-size:12px;margin-top:28px}input{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.fields label{display:grid;gap:8px}.notice{padding:12px 16px;background:var(--paper);border-radius:7px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){aside{position:static;width:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}aside strong{padding:0 0 8px;font-size:23px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0}.bar{height:52px;padding:0 20px}.page{padding:16px 20px 48px}h1{font-size:23px}.card{padding:18px}.facts{gap:16px 24px}.stats{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.section-summary{align-items:flex-start;flex-direction:column;gap:2px;padding:12px 0}details dl{grid-template-columns:90px 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<aside><strong>gling</strong><nav aria-label="시안 화면"><button data-view="meetup" aria-current="page">모임 상세</button><button data-view="member">회원 상세</button><button data-view="post">게시글 상세</button><button data-view="analytics">전체 성과</button></nav></aside>
<main><div class="bar"><span id="breadcrumb">모임 / 상세</span><span class="demo">디자인 시안 · 예시 데이터</span></div><div class="page" id="content"></div></main>
<template id="meetup"><button class="back" data-back>‹ 모임 목록</button><header class="heading"><span class="badge">모집 중</span><h1>주말, 공원 산책 같이 가요</h1><p class="muted">밴쿠버 · 10월 24일 (토) 오후 2:00</p></header><div class="tabs" role="tablist" aria-label="모임 상세 메뉴"><button role="tab" aria-selected="true" data-pane="info">모임 정보</button><button role="tab" aria-selected="false" data-pane="requests">참여 신청</button><button role="tab" aria-selected="false" data-pane="chat">대화</button></div><section class="card" data-content="info"><dl class="facts"><div><dt>주최자</dt><dd><button class="link" data-open-member>산책친구</button></dd></div><div><dt>참여 인원</dt><dd>3 / 8명</dd></div></dl><h2>모임 소개</h2><p class="copy">주말 오후에 공원을 천천히 걸어요. 한 시간 정도 산책하고 근처에서 커피 한 잔 하려고 해요.</p><details><summary>참여 조건·운영 정보</summary><div><dl><dt>모임 유형</dt><dd>일회성</dd><dt>참여 조건</dt><dd>전체 회원 · 연령대 무관</dd><dt>신청 질문</dt><dd>어떤 분위기의 만남을 기대하세요?</dd><dt>등록</dt><dd>2026. 10. 14. 오후 2:00</dd><dt>모임 ID</dt><dd>예시 모임 · 실제 운영 기록 아님</dd></dl></div></details></section><section class="card" data-content="requests" hidden><h2>참여 신청</h2><div class="row"><span>산책을좋아해요<br><small class="muted">가볍게 걷고 싶어서 신청했어요.</small></span><span class="badge">승인</span></div><div class="row"><span>주말산책<br><small class="muted">이번 주 토요일에 함께하고 싶어요.</small></span><span class="muted">대기</span></div></section><section class="card" data-content="chat" hidden><h2>모임 대화</h2><div class="row"><span><b>산책친구</b><p>토요일 오후 2시, 공원 입구에서 만나요.</p></span><time class="muted">14:10</time></div><div class="row"><span><b>산책을좋아해요</b><p>좋아요. 토요일에 뵐게요!</p></span><time class="muted">14:12</time></div><details><summary>대화 추적 정보</summary><div>예시 대화 · 실제 메시지 아님</div></details></section></template>
<template id="member"><button class="back" data-view="meetup">‹ 모임으로 돌아가기</button><header class="heading"><span class="badge">정상</span><h1>산책친구</h1><p class="muted">밴쿠버 · 가입 2026. 9. 10.</p></header><div class="card"><dl class="facts"><div><dt>멤버십</dt><dd>무료 회원</dd></div><div><dt>인증</dt><dd>레벨 1</dd></div><div><dt>최근 활동</dt><dd>오늘</dd></div></dl><h2>최근 활동</h2><div class="row"><span>주말, 공원 산책 같이 가요<br><small class="muted">모임 작성 · 오늘</small></span></div><details><summary>프로필·운영 관리</summary><div>인증 상태와 계정 조치는 이곳에서 확인합니다.</div></details><details><summary>접속·문제 추적 정보</summary><div>회원 ID와 접속 환경은 필요할 때 확인합니다.</div></details></div></template>
<template id="post"><button class="back" data-view="meetup">‹ 목록</button><header class="heading"><span class="badge">게시 중</span><h1>처음 온 밴쿠버, 산책하기 좋은 곳</h1><p class="muted">산책친구 · 밴쿠버 · 10월 14일</p></header><article class="card"><p class="copy">날씨가 맑아서 동네 공원을 걸었어요. 천천히 걷고 쉬어 가기 좋은 곳이 있으면 알려주세요.</p><details><summary>노출·수치 관리</summary><div><div class="fields"><label>조회수<input type="number" value="18"></label><label>공감수<input type="number" value="2"></label><label>저장수<input type="number" value="1"></label></div><p class="notice">예시 편집 화면입니다. 실제 데이터는 변경하지 않습니다.</p></div></details></article></template>
<template id="analytics"><header class="heading"><h1>전체 성과</h1><p class="muted">선택 기간 30일 · 예시 수치</p></header><div class="stats"><div><span>신규 가입</span><strong>24</strong></div><div><span>DAU</span><strong>12</strong></div><div><span>WAU</span><strong>30</strong></div><div><span>MAU</span><strong>56</strong></div></div><div class="card"><details open style="border:0;margin-top:0"><summary class="section-summary">활동<small>일별 방문 추이</small></summary><div><p class="notice">일별 차트와 정확한 수치 표가 표시되는 영역입니다.</p><details><summary>집계 기준</summary><div>로그인 회원의 화면 방문 기준이며 UTC를 사용합니다.</div></details></div></details><details><summary class="section-summary">성장·유입<small>신규 가입 24명</small></summary><div>가입과 유입 채널을 확인합니다. 미수집 채널은 별도로 표시합니다.</div></details><details><summary class="section-summary">재방문·코호트<small>D1 · D7 · D30</small></summary><div>관측이 끝난 가입 코호트를 기준으로 봅니다.</div></details><details><summary class="section-summary">커뮤니티<small>글 · 댓글 · 모임 · 상호 대화</small></summary><div>실제로 생성된 참여 기록입니다.</div></details><details><summary class="section-summary">행사·장소<small>열람 · 길찾기 · 웹사이트</small></summary><div>새 행동 기록은 앱 코드 배포 이후 수집됩니다.</div></details><details><summary class="section-summary">알림<small>발송 접수와 실제 탭 구분</small></summary><div>미수집 클릭을 0건으로 표시하지 않습니다.</div></details><details><summary class="section-summary">수익<small>통화별 멤버십 결제</small></summary><div>환불·정산은 미연결입니다.</div></details><details><summary class="section-summary">품질<small>오류 · 신고</small></summary><div>확인 가능한 실패 기록과 처리 현황을 봅니다.</div></details></div></template>
<script>
const content=document.querySelector('#content');
function show(name){content.replaceChildren(document.querySelector('#'+name).content.cloneNode(true));document.querySelector('#breadcrumb').textContent=({meetup:'모임 / 상세',member:'회원 / 상세',post:'게시글 / 상세',analytics:'분석 / 전체 성과'})[name];document.querySelectorAll('aside button').forEach(b=>b.toggleAttribute('aria-current',false));document.querySelector('aside [data-view="'+name+'"]').setAttribute('aria-current','page');window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)show(b.dataset.view);if(b.hasAttribute('data-open-member'))show('member');if(b.dataset.pane){document.querySelectorAll('[data-pane]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelectorAll('[data-content]').forEach(p=>p.hidden=p.dataset.content!==b.dataset.pane)}if(b.hasAttribute('data-back')){content.innerHTML='<header class="heading"><h1>모임 목록</h1><p class="muted">시안용 예시 목록</p></header><button data-view="meetup" style="width:100%;text-align:left">주말, 공원 산책 같이 가요 <span class="muted">상세 보기 ›</span></button>'}});show('meetup');
</script>

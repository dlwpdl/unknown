<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gling · 시작하는 순간</title>
<style>
:root{color-scheme:light;--paper:#faf9f5;--ink:#21252c;--muted:#5b6270;--line:#e5e3db;--red:#be3b2a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:34px 30px 28px}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #34506b;outline-offset:4px}.masthead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.masthead img{width:74px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.12em}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:25px 0 22px}h1{font-size:32px;letter-spacing:-1.5px;line-height:1.2;margin:0 0 9px}.intro p{font-size:14px;line-height:1.6;color:var(--muted);margin:0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.controls label{display:flex;align-items:center;gap:6px;min-height:44px}input{accent-color:var(--red);width:16px;height:16px}select{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);padding:11px 9px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:1px solid var(--line);border-radius:20px;padding:20px 20px 16px;background:#f3f1eb}.card-head{height:28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.card-head h2{font-size:17px;letter-spacing:-.4px;margin:0}.badge{font-size:11px;color:var(--red);background:#f8e6df;padding:5px 8px;border-radius:20px}.phone{position:relative;aspect-ratio:942/2048;width:min(100%,260px);margin:auto;overflow:hidden;border:5px solid #292b2e;border-radius:35px;background:var(--paper);box-shadow:0 14px 28px #21252c0c;isolation:isolate;container-type:inline-size}.home{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.curtain{position:absolute;inset:0;background:var(--paper)}.island{position:absolute;top:1.55%;left:34.5%;width:31%;height:4.1%;border-radius:50px;background:#000;z-index:5}.brand{position:absolute;left:22%;top:43%;width:56%;aspect-ratio:720/320;transform-origin:top left;will-change:transform,opacity}.brand>img{width:100%;display:block;clip-path:polygon(0 0,88% 0,88% 37%,100% 37%,100% 100%,0 100%)}.mark{position:absolute;left:33%;top:39%;width:34%;aspect-ratio:1;opacity:0;will-change:transform,opacity}.mark img{width:100%;filter:brightness(0) saturate(100%) invert(22%) sepia(72%) saturate(2144%) hue-rotate(347deg) brightness(94%) contrast(88%);clip-path:polygon(0 0,65% 0,65% 32%,100% 32%,100% 100%,0 100%)}.orb{position:absolute;left:68%;top:16%;width:15%;aspect-ratio:1;border-radius:50%;background:var(--red)}.orbit{position:absolute;inset:0;transform-origin:50% 53%}.footer-line{position:absolute;left:36%;bottom:1%;width:28%;height:4px;border-radius:10px;background:var(--ink);z-index:5}.caption{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:18px 0 0}.caption p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.replay{border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:44px;min-width:84px;padding:10px 12px;border-radius:12px;font-size:13px}.replay:active{transform:scale(.97)}footer{margin-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px;line-height:1.7}footer a{color:inherit;text-underline-offset:3px}.status{min-height:18px;margin:0;color:var(--muted);font-size:12px}
@media(max-width:680px){main{padding:22px 16px}.intro{display:block}.controls{margin-top:14px}.compare{gap:12px}.card{padding:14px 10px}.card-head h2{font-size:14px}.badge{font-size:10px;padding:4px 6px}.phone{border-width:4px;border-radius:27px}.caption{display:block}.replay{margin-top:10px;width:100%}h1{font-size:28px}.caption p{min-height:38px}}
@media(max-width:400px){.compare{grid-template-columns:1fr}.caption{display:flex}.replay{width:auto;margin:0}.caption p{min-height:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}.replay:active{transform:none}}
.home-logo-mask{position:absolute;left:5%;top:8%;width:20%;height:5%;background:var(--paper)}

[data-kind="link"] .prefix{clip-path:inset(0 29% 0 0)}
.last-g{position:absolute;left:71.111111%;top:0;width:28.888889%;height:100%;transform-origin:41.346154% 51.25%;will-change:transform}
.glyph-reveal{position:absolute;inset:0}
.glyph-ink{position:absolute;inset:0;background:#11171e;mask:url(wordmark.png) right center/346.153846% 100% no-repeat;clip-path:polygon(0 0,64% 0,64% 37%,100% 37%,100% 100%,0 100%)}
.last-g .orbit{transform-origin:41.346154% 51.25%}
.last-g .orb{left:65.865385%;top:21.25%;width:18.269231%;background:#da2e1e}
</style>
<main>
 <div class="masthead"><img src="wordmark.png" alt="gling"><span class="eyebrow">STARTUP MOTION · 02</span></div>
 <div class="intro"><div><h1>글링, 시작하는 순간.</h1><p>링에서 g로, 끊김 없이.<br>글이 열리고, 사람이 이어진다.</p></div><div class="controls"><label><input id="reduced" type="checkbox">동작 줄이기</label><select id="speed" aria-label="미리보기 재생 속도"><option value="1">실제 속도</option><option value="3">3배 느리게</option></select></div></div>
 <div class="compare">
  <section class="card" data-kind="before"><div class="card-head"><h2>이전 · 이어지는 글링.</h2><span class="eyebrow">BEFORE</span></div><div class="phone" aria-label="점이 원을 따라 연결되고 홈으로 이어지는 모션 시안"><img class="home" src="home.png" alt="기존 글링 홈 화면 참고 이미지"><div class="home-logo-mask"></div><div class="curtain"></div><div class="mark" aria-hidden="true"><img src="mark.png" alt=""><div class="orbit"><span class="orb"></span></div></div><div class="brand" aria-hidden="true"><img src="wordmark.png" alt=""><span class="dot"></span><span class="ripple"></span></div><div class="island"></div><div class="footer-line"></div></div><div class="caption"><p>점이 둥글게 돌아 연결되고<br>글링의 이름으로. · 0.95초</p><button class="replay" type="button">↻ 다시 보기</button></div></section>
  <section class="card" data-kind="link"><div class="card-head"><h2>수정 · 링이 마지막 g로.</h2><span class="badge">수정안</span></div><div class="phone" aria-label="하나의 링이 마지막 g가 되어 글링 로고를 완성하는 모션 시안"><img class="home" src="home.png" alt="기존 글링 홈 화면 참고 이미지"><div class="home-logo-mask"></div><div class="curtain"></div><div class="brand" aria-hidden="true"><img class="prefix" src="wordmark.png" alt=""><div class="last-g"><div class="glyph-reveal"><div class="glyph-ink"></div></div><div class="orbit"><span class="orb"></span></div></div></div><div class="island"></div><div class="footer-line"></div></div><div class="caption"><p>링이 마지막 g가 되고<br>왼쪽에 glin이 이어져요. · 0.95초</p><button class="replay" type="button">↻ 다시 보기</button></div></section>
 </div>
 <footer><span>모션 시안 · 소리 없음 · 홈은 기존 QA 캡처 · 앱 미반영</span><span>참고: <a href="https://developer.apple.com/design/human-interface-guidelines/launching" target="_blank" rel="noopener">Apple HIG</a> · <a href="https://mobbin.com/screens/c4259511-2fdd-4492-8bf9-5ac3b4deeeda" target="_blank" rel="noopener">Mobbin</a></span></footer>
 <p class="status" aria-live="polite"></p>
</main>
<script>
const cards = [...document.querySelectorAll('.card')];
const reduced = document.querySelector('#reduced');
const preference = matchMedia('(prefers-reduced-motion: reduce)');
reduced.checked = preference.matches;
const running = new Map();
function play(card) {
 const previous = running.get(card);
 previous?.animations.forEach(a => a.cancel());
 const run = {animations:[]}; running.set(card, run);
 const speed = Number(document.querySelector('#speed').value);
 const find = s => card.querySelector(s);
 const brand = find('.brand'), curtain = find('.curtain'), mark = find('.mark'), headerMask = find('.home-logo-mask');
 const animate = (el,frames,duration,delay=0,easing='cubic-bezier(.22,.75,.22,1)') => {
  const a = el.animate(frames,{duration:duration*speed,delay:delay*speed,easing,fill:'both'});
  run.animations.push(a); return a;
 };
 brand.style.opacity = '1'; curtain.style.opacity = '1'; headerMask.style.opacity = '1'; if(mark) mark.style.opacity = '0';
 card.dataset.state = 'playing';
 let finish;
 if(reduced.checked) {
  brand.style.opacity = '0'; headerMask.style.opacity = '0';
  finish = animate(curtain,[{opacity:1},{opacity:0}],120);
 } else {
  const morph = card.dataset.kind === 'link';
  const lead = morph ? 500 : 390;
  const phone = find('.phone');
  if(morph) {
   // The same asset-derived g and orbiting dot persist into the full wordmark.
   const dx = phone.clientWidth * (.5 - .22 - .56 * 598 / 720);
   const dy = phone.clientHeight * (.47 - .43) - phone.clientWidth * .56 * 164 / 720;
   animate(find('.last-g'),[{transform:`translate(${dx}px,${dy}px) scale(1.85)`},{transform:'translate(0,0) scale(1)'}],360,180);
   animate(find('.glyph-reveal'),[{clipPath:'ellipse(39.423077% 22.1875% at 41.346154% 50%)'},{clipPath:'ellipse(100% 100% at 41.346154% 50%)'}],220,230);
   animate(find('.glyph-ink'),[{backgroundColor:'#be3b2a'},{backgroundColor:'#11171e'}],210,240);
   animate(find('.prefix'),[{opacity:0,clipPath:'inset(0 29% 0 71%)'},{opacity:1,clipPath:'inset(0 29% 0 0%)'}],280,240);
   animate(find('.orbit'),[{transform:'rotate(-215deg)'},{transform:'rotate(0deg)'}],280);
  } else {
   animate(mark,[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'scale(1)',offset:.2},{opacity:1,offset:.72},{opacity:0,transform:'scale(.98)'}],460,0,'linear');
   animate(find('.orbit'),[{transform:'rotate(-215deg)'},{transform:'rotate(4deg)',offset:.85},{transform:'rotate(0deg)'}],350,0);
  }
  const x = phone.clientWidth * (.0604 - .22), y = phone.clientHeight * (.089 - .43);
  animate(brand,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${x}px,${y}px) scale(.2821)`}],950-lead,lead);
  animate(brand,morph ? [{opacity:1},{opacity:1,offset:.9},{opacity:0}] : [{opacity:0},{opacity:0,offset:.3},{opacity:1,offset:.5},{opacity:1,offset:.88},{opacity:0}],950,0,'linear');
  animate(headerMask,[{opacity:1},{opacity:0}],80,870);
  finish = animate(curtain,[{opacity:1},{opacity:0}],950-lead-160,lead+160);
 }
 finish.finished.then(()=>{
  if(running.get(card)!==run)return;
  card.dataset.state='complete';
  document.querySelector('.status').textContent = reduced.checked ? '동작 줄이기 · 0.12초 페이드' : '다시 보기로 움직임을 비교해 보세요.';
 }).catch(()=>{});
}
cards.forEach(card=>card.querySelector('button').addEventListener('click',()=>play(card)));
function playAll(){cards.forEach(play)}
document.querySelector('#speed').addEventListener('change',playAll);
reduced.addEventListener('change',playAll);
preference.addEventListener('change',e=>{reduced.checked=e.matches;playAll()});
Promise.all([...document.images].map(img=>img.decode().catch(()=>{}))).then(playAll);
</script>
</html>

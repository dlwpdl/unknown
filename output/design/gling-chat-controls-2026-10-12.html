<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글링 · 대화와 위치 공유 시안</title>
<style>
:root{color-scheme:dark;--bg:#0B0B12;--card:#171722;--line:#343443;--sub:#B7B4C3;--iris:#CBB9FF;--ink:#171123;font:16px/1.5 system-ui}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#F6F3F0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px;letter-spacing:-.03em;margin:0 0 8px}p{color:var(--sub);margin:0 0 20px}button,input,textarea{font:inherit}button{min-height:48px;min-width:48px;padding:10px 16px;border:0;border-radius:12px;background:#222231;color:inherit;cursor:pointer}button:active{transform:translateY(1px);background:var(--line)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--iris);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--iris);color:var(--ink);font-weight:700}.device{margin:auto;width:100%;max-width:480px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;background:var(--bg)}.bar,.composer,.choices,.row{display:flex;align-items:center;gap:8px;padding:12px}.bar{border-bottom:1px solid var(--line)}.bar strong{flex:1}.messages{padding:16px;min-height:360px;display:flex;flex-direction:column;gap:12px}.message{max-width:85%;align-self:flex-start}.mine{align-self:flex-end}.author{color:var(--sub);font-size:13px;margin:0 0 4px}.bubble{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;overflow-wrap:anywhere}.mine .bubble{background:var(--iris);color:var(--ink);border:0}.quote{display:block;border-left:2px solid currentColor;padding-left:8px;opacity:.8;font-size:13px;margin-bottom:8px}.stamp{font-size:12px;color:var(--sub);margin-top:4px;text-align:right}.composer{border-top:1px solid var(--line);background:var(--card)}input,textarea{min-height:48px;min-width:0;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:inherit}.composer input{flex:1}.choices{padding-top:0;background:var(--card)}.choices button{flex:1}.reply{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border-top:1px solid var(--line)}.reply span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.reply b{display:block;color:var(--iris)}dialog{position:fixed;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);width:440px;overflow:auto;border:1px solid var(--line);border-radius:20px;padding:20px;background:var(--card);color:inherit}dialog::backdrop{background:rgba(0,0,0,.66)}dialog h2{margin:0 0 12px;font-size:20px}dialog .actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}.preview{color:var(--sub);overflow-wrap:anywhere;max-height:90px;overflow:auto}textarea{min-height:120px;resize:vertical}.map{height:280px;position:relative;overflow:hidden;border-radius:16px;background:#DEDCCC;color:#343443;margin:12px 0;cursor:crosshair}.map svg{width:100%;height:100%}.pin{position:absolute;top:46%;left:48%;background:#8169B1;color:white;border:3px solid white;border-radius:50%;width:26px;height:26px;box-shadow:0 3px 8px #0005;pointer-events:none}.map-label{position:absolute;left:10px;bottom:10px;font-size:12px;color:#344}.search-row{display:flex;gap:8px}.search-row input{flex:1}.result{display:block;text-align:left;width:100%;margin-bottom:12px}.selected{padding:12px 0;overflow-wrap:anywhere}.toast{min-height:24px;color:var(--iris);font-size:14px;margin-top:16px;text-align:center}.hidden,[hidden]{display:none!important}@media(max-width:520px){main{padding:16px 8px}.device{border-radius:18px}.bar{flex-wrap:wrap}.messages{padding:12px}.composer{padding:8px}.composer button{padding:10px}.row{flex-wrap:wrap}.map{height:220px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
<main><h1>꾹 눌러 답장하고, 장소를 골라 공유하기</h1><p>1:1·모임 대화에 같은 기능을 적용한 오프라인 시안입니다. 지도와 대화는 예시이며 실제 메시지는 보내지 않습니다.</p>
<div class="device"><div class="bar"><button id="channel" aria-label="대화 종류 변경">1:1 대화</button><strong id="title">지우</strong><span>gling</span></div><div id="messages" class="messages"></div><div id="reply" class="reply" hidden><span></span><button id="reply-cancel">답장 취소</button></div><form id="composer" class="composer"><button type="button" id="plus" aria-label="첨부 메뉴 열기" aria-expanded="false">＋</button><input id="draft" aria-label="메시지" placeholder="메시지를 입력하세요" maxlength="2000"><button class="primary">보내기</button></form><div id="attachments" class="choices" hidden><button id="location-open">📍 위치 공유하기</button></div></div><div class="toast" id="toast" role="status">말풍선을 꾹 누르거나 키보드로 선택해 메뉴를 열어 보세요.</div>
<dialog id="menu"><h2>메시지</h2><div class="preview" id="menu-preview"></div><div class="actions"><button id="reply-action">답장</button><button id="edit-action">메시지 수정</button><button id="delete-action">메시지 삭제</button><button data-close="menu">닫기</button></div></dialog>
<dialog id="edit"><h2>메시지 수정</h2><textarea id="edit-draft" aria-label="수정할 메시지" maxlength="2000"></textarea><div class="actions"><button class="primary" id="edit-save">수정 저장</button><button data-close="edit">취소</button></div></dialog>
<dialog id="remove"><h2>메시지를 삭제할까요?</h2><div class="preview">대화에는 ‘삭제된 메시지입니다’가 남아요.</div><div class="actions"><button class="primary" id="delete-confirm">삭제하기</button><button data-close="remove">취소</button></div></dialog>
<dialog id="location"><h2>위치 공유하기</h2><form id="search" class="search-row"><input id="query" placeholder="장소 이름 또는 주소" aria-label="장소 이름 또는 주소" maxlength="240"><button>검색</button></form><button id="result" class="result" hidden></button><div class="map" id="map" role="button" tabindex="0" aria-label="지도에서 위치 선택"><svg viewBox="0 0 400 280" aria-hidden="true"><rect width="400" height="280" fill="#DBDCCC"/><path d="M0 170Q150 140 240 205T420 240V280H0" fill="#A3C2CA"/><path d="M100 -20L185 280M250 -20L320 280M-20 60L420 140M-20 140L420 205" stroke="#FFFDF6" stroke-width="14"/><path d="M90 5L130 45L76 56L55 16M250 185L270 217L228 209Z" fill="#ABBC97"/></svg><span class="map-label">밴쿠버 · 예시 지도</span><span class="pin" id="pin" hidden></span></div><button id="current">현재 위치 선택</button><div class="selected" id="selected">공유할 위치를 선택해 주세요.</div><div class="actions"><button class="primary" id="location-send" disabled>이 위치 공유하기</button><button data-close="location">닫기</button></div></dialog>
</main>
<script>
const $=id=>document.getElementById(id);let group=false,target=null,parent=null,point=null,timer;
const rows=[{id:1,mine:false,body:'토요일에는 도서관 앞에서 만날까요?'},{id:2,mine:true,body:'좋아요! 정확한 위치 보내주세요.'},{id:3,mine:false,body:'시간은 오후 2시 어때요?'}];
const feedback=()=>navigator.vibrate?.(8);const say=text=>{$('toast').textContent=text;};
function close(id){$(id).close()}function open(id){$(id).showModal()}
function render(){
 $('messages').replaceChildren();for(const row of rows){const box=document.createElement('div');box.className='message'+(row.mine?' mine':'');
 if(!row.mine){const author=document.createElement('div');author.className='author';author.textContent=group?'지우 · 모임 멤버':'지우';box.append(author)}
 const bubble=document.createElement('button');bubble.className='bubble';bubble.setAttribute('aria-label',(row.mine?'내 메시지':'지우 메시지')+' 메뉴');
 if(row.parent){const original=rows.find(item=>item.id===row.parent),quote=document.createElement('span');quote.className='quote';quote.textContent=original?.body??'원본 메시지를 볼 수 없어요.';bubble.append(quote)}
 bubble.append(document.createTextNode(row.body));bubble.disabled=!!row.deleted;
 const show=()=>{clearTimeout(timer);if(row.deleted)return;feedback();target=row; $('menu-preview').textContent=row.body;$('edit-action').hidden=!row.mine||!!row.location;$('delete-action').hidden=!row.mine;open('menu')};
 bubble.onpointerdown=()=>timer=setTimeout(show,400);bubble.onpointerup=bubble.onpointercancel=bubble.onpointerleave=()=>clearTimeout(timer);bubble.oncontextmenu=e=>{e.preventDefault();show()};bubble.onclick=e=>{if(e.detail===0)show()};box.append(bubble);
 const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=(row.edited&&!row.deleted?'수정됨 · ':'')+'오후 1:42';box.append(stamp);$('messages').append(box);
 }$('reply').hidden=!parent;$('reply').querySelector('span').replaceChildren();if(parent){const b=document.createElement('b');b.textContent='답장';$('reply').querySelector('span').append(b,document.createTextNode(parent.body))}
}
document.addEventListener('click',e=>{if(e.target.closest('button'))feedback()});document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>close(button.dataset.close));
$('channel').onclick=()=>{group=!group;$('channel').textContent=group?'모임 대화':'1:1 대화';$('title').textContent=group?'주말 산책 모임':'지우';render()};
$('plus').onclick=()=>{const expanded=$('attachments').hidden;$('attachments').hidden=!expanded;$('plus').setAttribute('aria-expanded',String(expanded))};
$('reply-action').onclick=()=>{parent=target;close('menu');render();$('draft').focus()};$('reply-cancel').onclick=()=>{parent=null;render()};
$('edit-action').onclick=()=>{$('edit-draft').value=target.body;close('menu');open('edit');$('edit-draft').focus()};$('edit-save').onclick=()=>{const body=$('edit-draft').value.trim();if(!body)return;target.body=body;target.edited=true;close('edit');render();say('메시지를 수정했어요.')};
$('delete-action').onclick=()=>{close('menu');open('remove')};$('delete-confirm').onclick=()=>{target.body='삭제된 메시지입니다.';target.deleted=true;if(parent?.id===target.id)parent=null;close('remove');render();say('메시지를 삭제했어요.')};
$('composer').onsubmit=e=>{e.preventDefault();const body=$('draft').value.trim();if(!body)return;rows.push({id:Date.now(),mine:true,body,parent:parent?.id});$('draft').value='';parent=null;render();say('답장을 보냈어요. (예시)')};
function choose(label,latitude,longitude){point={label,latitude,longitude};$('selected').textContent=label;$('location-send').disabled=false;$('pin').hidden=false;feedback()}
$('location-open').onclick=()=>{point=null;$('selected').textContent='공유할 위치를 선택해 주세요.';$('location-send').disabled=true;$('pin').hidden=true;$('result').hidden=true;$('attachments').hidden=true;$('plus').setAttribute('aria-expanded','false');open('location')};
$('search').onsubmit=e=>{e.preventDefault();if(!$('query').value.trim())return;point=null;$('location-send').disabled=true;$('result').hidden=false;$('result').textContent='Vancouver Public Library · 350 W Georgia St';$('result').onclick=()=>{choose('Vancouver Public Library',49.2797,-123.1156);$('result').hidden=true}};
$('map').onclick=e=>{const rect=$('map').getBoundingClientRect();$('pin').style.left=(e.clientX-rect.left)/rect.width*100+'%';$('pin').style.top=(e.clientY-rect.top)/rect.height*100+'%';choose('선택한 위치',49.2827,-123.1207)};$('map').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose('선택한 위치',49.2827,-123.1207)}};
$('current').onclick=()=>choose('현재 위치 (예시)',49.2827,-123.1207);$('location-send').onclick=()=>{if(!point)return;rows.push({id:Date.now(),mine:true,body:'📍 '+point.label,location:true,parent:parent?.id});parent=null;close('location');render();say('선택한 위치를 공유했어요. (예시)')};render();
</script></html>

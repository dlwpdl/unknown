const $=s=>document.querySelector(s);let city='밴쿠버',filtered='전체',toastTimer,returnFocus;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function toast(t){let outlet=$('.toast');if(dialog.open){outlet=$('.sheet-status');if(!outlet){outlet=document.createElement('p');outlet.className='fine sheet-status';outlet.setAttribute('role','status');$('.sheet-body').append(outlet)}}outlet.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>outlet.textContent='',2600)}
function filter(name){filtered=name;document.querySelectorAll('.categories button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===name));document.querySelectorAll('[data-category]').forEach(p=>p.hidden=name!=='전체'&&!p.dataset.category.split(' ').includes(name));$('.scroll').scrollTop=0}
const dialog=$('dialog');let y=0,v=0,target=0,raf=0,last=0,closing=false;
function paint(){dialog.style.transform=`translateY(${y}px)`}
function tick(now){const dt=Math.min((now-last)/1000,.032);last=now;v+=(-360*(y-target)-38*v)*dt;y+=v*dt;paint();if(Math.abs(y-target)<.35&&Math.abs(v)<3){y=target;v=0;paint();raf=0;if(closing){dialog.close();returnFocus?.focus()}}else raf=requestAnimationFrame(tick)}
function move(to,close=false){cancelAnimationFrame(raf);target=to;closing=close;if(reduced.matches){y=to;v=0;paint();if(close){dialog.close();returnFocus?.focus()}return}last=performance.now();raf=requestAnimationFrame(tick)}
function close(){move(dialog.offsetHeight+20,true)}
function show(title,body){returnFocus=document.activeElement;$('.sheet-title').textContent=title;$('.sheet-body').innerHTML=body;if(!dialog.open){dialog.showModal();y=dialog.offsetHeight+20;v=0;paint()}move(0);$('.close').focus()}
function cities(){show('어느 동네로 갈까요?',`<p>가까운 도시의 이야기를 둘러보세요.</p>${['밴쿠버','토론토'].map((c,i)=>`<button class="city-row ${city===c?'selected':''}" data-city="${c}"><div><strong>${c}</strong><span>${i?'Ontario':'British Columbia'}</span></div>${city===c?ICONS.check:'<small>운영 중</small>'}</button>`).join('')}<p class="fine">다음에 만날 도시</p>${['몬트리올','캘거리','위니펙','서스캐툰'].map(c=>`<button class="city-row" disabled><strong>${c}</strong><small>준비 중</small></button>`).join('')}<p class="fine">기기 위치 권한 없이 직접 선택합니다.</p>`)}
function compose(){show('오늘의 한 편',`<p>작은 일상도 이웃에게는 반가운 이야기예요.</p><div class="detail-tag">${city} · 오늘 1편 남음</div><label for="title">제목</label><input id="title" placeholder="어떤 이야기를 나누고 싶나요?"><label for="body">이야기</label><textarea id="body" placeholder="오늘 동네에서 만난 순간을 적어 보세요."></textarea><button class="primary" data-action="draft">시안에서 작성 완료</button><p class="fine">사진 선택과 AI 초안은 실제 앱의 기존 기능을 이어갑니다. 이 시안에서는 게시되거나 전송되지 않습니다.</p><p class="fine">모든 새 글·댓글·대화는 동의 후 자동 안전 분석 대상이며, 권한 있는 관리자가 검토할 수 있습니다.</p>`)}
function detail(post){show('킷츠 해변에서 본 것',`<div class="detail-tag">라이프 · 예시 게시글</div><p class="reading"></p><div class="action-row"><button data-action="like">${ICONS.heart} 공감</button><button data-action="more">신고·차단</button></div><p class="fine">상세 읽기 시안입니다. 실제 앱의 로그인·온보딩·동의 절차는 그대로 적용합니다.</p>`);$('.reading').textContent=post?.querySelector('p')?.textContent||'퇴근하고 걸었는데, 오늘따라 노을이 참 온화하더라. 다들 오늘 하루 어땠어요?';if(post){$('.sheet-title').textContent=post.querySelector('h2').innerText;$('.detail-tag').textContent=post.dataset.category+' · 예시 게시글'}}
function more(){show('이웃과 안전하게',`<p>불편한 콘텐츠를 신고하거나 이 사용자를 차단할 수 있습니다.</p><div class="action-row"><button data-action="report">게시글 신고</button><button data-action="block">사용자 차단</button></div><p class="fine">검토용 시안으로 실제 신고·차단은 실행되지 않습니다.</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.city){city=b.dataset.city;document.querySelectorAll('.current-city').forEach(x=>x.textContent=city);close();toast(city+' 이야기로 전환했어요 · 시안');return}if(b.dataset.filter){filter(b.dataset.filter);return}const a=b.dataset.action;if(a==='city')cities();if(a==='compose')compose();if(a==='detail')detail(b.closest('article'));if(a==='close')close();if(a==='more')more();if(a==='like'||a==='save'){const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',!on);const count=b.querySelector('span');if(count)count.textContent=String(Number(count.textContent)+(on?-1:1));toast(a==='like'?(on?'공감을 취소했어요':'공감했어요'):(on?'저장을 취소했어요':'저장했어요'))}if(a==='search')show('이웃의 이야기 찾기','<label for="search">제목·내용·해시태그</label><input id="search" type="search" placeholder="동네, 정착, 맛집 검색"><p>요즘 뜨는 이야기</p><div class="action-row"><button data-action="searchtag">#첫정착</button><button data-action="searchtag">#주말</button></div><p class="fine">검색 배치 시안입니다. 결과는 운영 데이터와 연결하지 않았습니다.</p>');if(a==='meetup')show('이번 토요일, 라멘 원정대',`<div class="detail-tag">모임 · 리치먼드 · 예시 모임</div><p class="reading">새로 생긴 라멘집에서 함께 점심 먹어요. 4명 중 3명이 함께하고 있어요.</p><button class="primary" data-action="join">참여 신청 시안</button><p class="fine">실제 참여 시에는 기존 로그인과 프로필 동의 절차를 거칩니다.</p>`);if(['chat','profile','bell'].includes(a))show(a==='chat'?'채팅':a==='profile'?'나의 글링':'알림',`<p>이번 비교는 오늘 피드·도시 선택·글쓰기를 중심으로 구성했습니다. ${a==='chat'?'채팅':a==='profile'?'프로필':'알림'}은 기존 경로를 유지하는 시안입니다.</p>${a==='chat'?'<p class="fine">개인·그룹 대화도 자동 안전 분석과 권한 있는 관리자 검토 대상이며 종단간 암호화 서비스가 아닙니다.</p>':''}`);if(a==='home'){$('.scroll').scrollTop=0;filter('전체')}if(a==='draft'){if(!$('#title').value.trim()){toast('제목을 먼저 적어 주세요');$('#title').focus()}else{close();toast('작성 시안 완료 · 실제로 게시되지 않습니다')}}if(['report','block','join','searchtag'].includes(a))toast('동작 위치를 확인하는 시안입니다')});
dialog.addEventListener('cancel',e=>{e.preventDefault();close()});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientY<r.top)close()}});
let startY=0,startOffset=0,previous=0,previousTime=0,dragging=false;const handle=$('.drag-handle');handle.addEventListener('pointerdown',e=>{cancelAnimationFrame(raf);dragging=true;startY=previous=e.clientY;startOffset=y;previousTime=e.timeStamp;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!dragging)return;const delta=e.clientY-startY;y=Math.max(-12,startOffset+delta);const dt=(e.timeStamp-previousTime)/1000;if(dt>0)v=(e.clientY-previous)/dt;previous=e.clientY;previousTime=e.timeStamp;paint()});function release(e){if(!dragging)return;dragging=false;if(e.timeStamp-previousTime>100)v=0;move(y+v*.15>dialog.offsetHeight*.25?dialog.offsetHeight+20:0,y+v*.15>dialog.offsetHeight*.25)}handle.addEventListener('pointerup',release);handle.addEventListener('pointercancel',()=>{dragging=false;v=0;move(0)});
window.addEventListener('message',e=>{if(e.source!==parent)return;const {theme,large,action}=e.data||{};if(theme)document.documentElement.classList.toggle('theme-dark',theme==='dark');if(large!==undefined)document.documentElement.classList.toggle('large-type',large);if(action==='city')cities();if(action==='compose')compose();if(action==='detail')detail()});
</script></body></html>

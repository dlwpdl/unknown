name: Claude security review

# Reviews every pull request into mobile-app for security issues and comments findings on the PR.
on:
  pull_request:
    branches: [mobile-app]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    # Fork PRs get no secrets in this public repo, so only same-repo branches are reviewed.
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5-5
          comment-pr: true
          upload-results: false
          exclude-directories: ios,android,assets,public/share-covers

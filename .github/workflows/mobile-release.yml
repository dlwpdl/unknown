name: Free mobile release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.repository.private == false }}
    uses: ./.github/workflows/ci.yml

  prepare:
    if: ${{ github.event.repository.private == false }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      version: ${{ steps.prepare.outputs.version }}
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check trusted release source
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/mobile-app
          if [ "$RELEASE_REF_TYPE" != tag ] && [ "$RELEASE_REF_NAME" != mobile-app ]; then
            echo 'Manual build checks must run from mobile-app.'
            exit 1
          fi
      - run: bash scripts/install-asc.sh
      - name: Allocate unused build number
        id: prepare
        env:
          GLING_ASC_JSON: ${{ secrets.GLING_ASC_JSON }}
          GLING_PLAY_JSON: ${{ secrets.GLING_PLAY_JSON }}
          GLING_PUBLIC_ENV_JSON: ${{ secrets.GLING_PUBLIC_ENV_JSON }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            RELEASE_TAG="$RELEASE_REF_NAME"
          else
            RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          fi
          python3 scripts/release.py prepare --tag "$RELEASE_TAG"

  ios:
    if: ${{ github.event.repository.private == false }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CI: '1'
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
      GLING_ASC_JSON: ${{ secrets.GLING_ASC_JSON }}
      GLING_PLAY_JSON: ${{ secrets.GLING_PLAY_JSON }}
      GLING_PUBLIC_ENV_JSON: ${{ secrets.GLING_PUBLIC_ENV_JSON }}
      GLING_SIGNING_JSON: ${{ secrets.GLING_SIGNING_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: npm ci
      - run: bash scripts/install-asc.sh
      - name: Build and verify signed IPA
        env:
          RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
        run: python3 scripts/release.py build --platform ios --build-number "$RELEASE_BUILD"
      - name: Submit to App Store review and TestFlight
        if: ${{ github.ref_type == 'tag' }}
        run: python3 scripts/release.py submit --platform ios

  android:
    if: ${{ github.event.repository.private == false }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.private == false && 'public' || 'private' }}
      GLING_ASC_JSON: ${{ secrets.GLING_ASC_JSON }}
      GLING_PLAY_JSON: ${{ secrets.GLING_PLAY_JSON }}
      GLING_PUBLIC_ENV_JSON: ${{ secrets.GLING_PUBLIC_ENV_JSON }}
      GLING_SIGNING_JSON: ${{ secrets.GLING_SIGNING_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Build and verify signed Android bundle
        env:
          RELEASE_BUILD: ${{ needs.prepare.outputs.build }}
        run: python3 scripts/release.py build --platform android --build-number "$RELEASE_BUILD"
      - name: Submit to Google Play internal testing
        if: ${{ github.ref_type == 'tag' }}
        run: python3 scripts/release.py submit --platform android
